name: validate

# Fast checks on every push and pull request: each case must satisfy the
# schema and have its required files. No compilation here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation deps
        run: python -m pip install pyyaml jsonschema

      - name: Validate all cases
        run: python infra/validate.py
