name: build

# Pull-request gate: build, run and render only the cases a PR affects, then
# assemble the site (without deploying). Fails if an affected case or the site
# build breaks. "Affected" = a case whose own files changed, or - when a shared
# input changes (the figure engine/scripts or the environment) - every case,
# matching what invalidates the media-cache keys.
#
# Caches are restored read-only: a PR reuses the per-ref samurai builds, the
# engine env and the rendered media the deploy on main produced, and never
# writes to the caches the deploy consumes. An affected case is a cache miss by
# construction and is genuinely rebuilt; a case flagged by the diff but whose
# media key is unchanged (e.g. a README edit) is restored and verified for free.
on:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.detect.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect affected cases
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"; echo "$changed"

          # A change to any shared input affects every case (the figure engine
          # and scripts, the environment, or the CI definition itself).
          shared='^(infra/galleria/|infra/case_meta\.py|infra/build_case\.sh|infra/cache\.py|infra/ensure_samurai\.sh|environment\.yml|\.github/workflows/)'
          if printf '%s\n' "$changed" | grep -qE "$shared"; then
            echo "Shared input changed -> all cases."
            cases=$(for d in cases/*/*/; do [ -f "${d}case.yaml" ] && printf '%s\n' "${d%/}"; done)
          else
            cases=$(printf '%s\n' "$changed" | grep -E '^cases/[^/]+/[^/]+/' \
                    | sed -E 's#^(cases/[^/]+/[^/]+)/.*#\1#' | sort -u \
                    | while read -r d; do [ -f "$d/case.yaml" ] && echo "$d"; done)
          fi

          echo "Affected cases:"; echo "${cases:-<none>}"
          if [ -z "$cases" ]; then
            json='[]'
          else
            json=$(printf '%s\n' "$cases" | jq -R . | jq -cs .)
          fi
          echo "cases=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: affected
    if: needs.affected.outputs.cases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.affected.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba (samurai-gallery env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # Read-only: reuse what the deploy on main produced. A bumped ref or a
      # changed case is simply a miss and is built fresh here.
      - name: Restore samurai builds (per ref)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/samurai-gallery
          key: samurai-gallery-${{ hashFiles('cases/*/*/case.yaml') }}
          restore-keys: |
            samurai-gallery-

      - name: Restore engine env (samurai-euler-env)
        uses: actions/cache/restore@v4
        with:
          path: ~/micromamba/envs/samurai-euler-env
          key: samurai-euler-env-${{ hashFiles('cases/*/*/case.yaml') }}
          restore-keys: |
            samurai-euler-env-

      - id: key
        name: Compute media cache key
        shell: bash -el {0}
        run: echo "value=$(micromamba run -n samurai-gallery python infra/cache.py key '${{ matrix.case }}' ci)" >> "$GITHUB_OUTPUT"

      - name: Restore rendered media (this case)
        uses: actions/cache/restore@v4
        with:
          path: .cache/media/${{ steps.key.outputs.value }}
          key: gallery-media-${{ steps.key.outputs.value }}

      # Fatal here: a broken affected case must fail the check.
      - name: Build, run and render ${{ matrix.case }}
        shell: bash -el {0}
        run: bash infra/build_case.sh "${{ matrix.case }}" ci

      - id: slug
        run: echo "enc=$(echo '${{ matrix.case }}' | tr / _)" >> "$GITHUB_OUTPUT"

      - name: Stage media
        run: |
          mkdir -p "artifact/${{ matrix.case }}"
          cp "${{ matrix.case }}"/thumbnail-dark.png \
             "${{ matrix.case }}"/thumbnail-light.png \
             "${{ matrix.case }}"/preview-dark.mp4 \
             "${{ matrix.case }}"/preview-light.mp4 \
             "artifact/${{ matrix.case }}/" 2>/dev/null || true

      - name: Upload media
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ steps.slug.outputs.enc }}
          path: artifact
          if-no-files-found: warn
          retention-days: 1

  # Assemble the site (no deploy) so a broken site build is caught before merge.
  # Runs whether or not any case was affected (doc-only PRs still validate the
  # site); skips only if the case build failed (the gate is already red then).
  site:
    needs: [affected, build]
    if: always() && needs.affected.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A doc-only PR affects no case, so there may be no media artifacts here.
      - name: Download rendered media
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: media-dl
          pattern: media-*
          merge-multiple: true

      - name: Place media into case dirs
        run: |
          if [ -d media-dl/cases ]; then cp -R media-dl/cases/. cases/; fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site (no deploy)
        working-directory: site
        run: |
          npm ci
          npm run build
