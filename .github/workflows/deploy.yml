name: deploy

# Build every case's media (compile -> run -> render), build the Astro site,
# and deploy it to GitHub Pages. Per-case build failures are non-fatal: the
# site always deploys, showing a placeholder for any case whose media is
# missing (collect-media tolerates gaps).
on:
  push:
    branches: [main]
  workflow_dispatch:

# samurai and engine versions are pinned per case in each case.yaml
# (samurai.ref / engine.repo+ref). infra/build_case.sh builds each ref on
# demand and caches it under ~/.cache/samurai-gallery, so cases can be tested
# against different samurai versions.
env:
  BASE_PATH: /samurai-gallery
  SITE_URL: https://hpc-maths.github.io

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gallery
        uses: actions/checkout@v4

      - name: Set up micromamba (samurai-gallery env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # Per-ref samurai installs and engine checkouts. The key includes a hash
      # of every case.yaml, so bumping any samurai.ref / engine.ref rebuilds
      # only what changed on the next run.
      - name: Cache samurai builds (per ref)
        uses: actions/cache@v4
        with:
          path: ~/.cache/samurai-gallery
          key: samurai-gallery-${{ hashFiles('cases/*/*/case.yaml') }}
          restore-keys: |
            samurai-gallery-

      # Rendered media, content-addressed per case by infra/cache.py: build_case.sh
      # skips compile+run+render and restores the media whenever a case's inputs
      # (its pinned samurai/engine ref, sources, and the figure engine/scripts)
      # are unchanged. Saved under a run-unique key and restored via the prefix;
      # obsolete entries age out under GitHub's LRU cache eviction.
      - name: Cache rendered media (per case)
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: gallery-media-${{ github.sha }}
          restore-keys: |
            gallery-media-

      - name: Build, run and render every case
        shell: bash -el {0}
        run: |
          fail=""
          for d in cases/*/*/; do
            [ -f "${d}case.yaml" ] || continue
            echo "::group::${d}"
            if bash infra/build_case.sh "${d}" ci; then
              echo "OK ${d}"
            else
              echo "::warning::media generation failed for ${d}"
              fail="${fail} ${d}"
            fi
            echo "::endgroup::"
          done
          [ -z "${fail}" ] && echo "all cases rendered" || echo "cases without media:${fail}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
