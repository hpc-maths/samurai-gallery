name: deploy

# Build every case's media in parallel (one job per case), then assemble and
# deploy the Astro site to GitHub Pages. Per-case failures are non-fatal: the
# site always deploys, showing a placeholder for any case whose media is missing
# (collect-media tolerates gaps), and failures are surfaced in the job summary.
#
# Each case is content-addressed (infra/cache.py), so a case whose inputs (its
# pinned samurai/engine ref, sources, and the figure engine/scripts) are
# unchanged is a cache hit and is not rebuilt. Successive deploys therefore only
# rebuild the cases that actually changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_PATH: /samurai-gallery
  SITE_URL: https://hpc-maths.github.io

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Enumerate every case as a matrix input.
  list:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.list.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          cases=$(for d in cases/*/*/; do [ -f "${d}case.yaml" ] && printf '%s\n' "${d%/}"; done)
          echo "Cases:"; echo "$cases"
          json=$(printf '%s\n' "$cases" | jq -R . | jq -cs .)
          echo "cases=$json" >> "$GITHUB_OUTPUT"

  # One parallel job per case: build, run and render, reusing the caches.
  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.list.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba (samurai-gallery env)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # Per-ref samurai installs and engine checkouts (keyed by all case.yaml, so
      # bumping any ref rebuilds only what changed on the next run).
      - name: Cache samurai builds (per ref)
        uses: actions/cache@v4
        with:
          path: ~/.cache/samurai-gallery
          key: samurai-gallery-${{ hashFiles('cases/*/*/case.yaml') }}
          restore-keys: |
            samurai-gallery-

      # The engine (samurai-euler) conda env, so engine cases do not recreate it
      # from scratch every run (micromamba create is slow).
      - name: Cache engine env (samurai-euler-env)
        uses: actions/cache@v4
        with:
          path: ~/micromamba/envs/samurai-euler-env
          key: samurai-euler-env-${{ hashFiles('cases/*/*/case.yaml') }}
          restore-keys: |
            samurai-euler-env-

      - id: key
        name: Compute media cache key
        shell: bash -el {0}
        run: echo "value=$(micromamba run -n samurai-gallery python infra/cache.py key '${{ matrix.case }}' ci)" >> "$GITHUB_OUTPUT"

      # Content-addressed rendered media for this case: an exact key hit lets
      # build_case.sh restore the media and skip compile+run+render entirely.
      - name: Cache rendered media (this case)
        uses: actions/cache@v4
        with:
          path: .cache/media/${{ steps.key.outputs.value }}
          key: gallery-media-${{ steps.key.outputs.value }}

      - name: Build, run and render ${{ matrix.case }}
        shell: bash -el {0}
        run: |
          # Non-fatal: a broken case must not block the whole deploy (the site
          # still ships a placeholder), but it must be visible in the summary.
          if bash infra/build_case.sh "${{ matrix.case }}" ci; then
            echo "- :white_check_mark: \`${{ matrix.case }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::media generation failed for ${{ matrix.case }}"
            echo "- :warning: \`${{ matrix.case }}\` failed to build/render" >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: slug
        run: echo "enc=$(echo '${{ matrix.case }}' | tr / _)" >> "$GITHUB_OUTPUT"

      # Stage under the case's real path so downloading with merge-multiple
      # reconstructs cases/<cat>/<slug>/ directly in the deploy job.
      - name: Stage media
        run: |
          mkdir -p "artifact/${{ matrix.case }}"
          cp "${{ matrix.case }}"/thumbnail-dark.png \
             "${{ matrix.case }}"/thumbnail-light.png \
             "${{ matrix.case }}"/preview-dark.mp4 \
             "${{ matrix.case }}"/preview-light.mp4 \
             "artifact/${{ matrix.case }}/" 2>/dev/null || true

      - name: Upload media
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ steps.slug.outputs.enc }}
          path: artifact
          if-no-files-found: warn
          retention-days: 1

  # Gather every case's media, build the site and deploy it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download rendered media
        uses: actions/download-artifact@v4
        with:
          path: media-dl
          pattern: media-*
          merge-multiple: true

      - name: Place media into case dirs
        run: |
          if [ -d media-dl/cases ]; then cp -R media-dl/cases/. cases/; fi
          n=$(find cases -maxdepth 3 -name 'thumbnail-dark.png' | wc -l | tr -d ' ')
          echo "### :framed_picture: media present for ${n} case(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
