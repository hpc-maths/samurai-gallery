title: Sod shock tube
summary: "The reference Sod shock tube (rotated into 2D): rarefaction, contact and shock."
authors:
  - The samurai-euler team
methods:
  - finite-volume
equation: compressible-euler
dimension: 2
adaptation: multiresolution
difficulty: advanced
featured: false
tags:
  - compressible
  - hllc
requires:
  - mpi
references:
  - text: "samurai-euler (Euler solver engine)"
    url: "https://github.com/hpc-maths/samurai-euler"
media:
  thumbnail: thumbnail.png
  hero: preview.mp4
env: samurai-euler-env
engine:
  source: ../samurai-euler
  code_file: scenario.hpp
run:
  target: euler_2d
  output_prefix: sod_hllc
  output_subdir: results
  profiles:
    ci:
      args: ["--test-case", "sod", "--scheme", "hllc", "--Tf", "0.2", "--min-level", "2", "--max-level", "8"]
      nfiles: 40
    hero:
      args: ["--test-case", "sod", "--scheme", "hllc", "--Tf", "0.2", "--min-level", "2", "--max-level", "10"]
      nfiles: 100
