title: Kelvin-Helmholtz instability
summary: Two shear layers roll up into the iconic billows; the mesh tracks the growing vortices.
authors:
  - The samurai-euler team
methods:
  - finite-volume
equation: compressible-euler
dimension: 2
adaptation: multiresolution
difficulty: advanced
featured: true
tags:
  - compressible
  - instability
  - shear-layer
  - hllc
requires:
  - mpi
references:
  - text: "samurai-euler (Euler solver engine)"
    url: "https://github.com/hpc-maths/samurai-euler"
  - text: "Kelvin-Helmholtz instability"
    url: "https://en.wikipedia.org/wiki/Kelvin%E2%80%93Helmholtz_instability"
media:
  thumbnail: thumbnail.png
  hero: preview.mp4
env: samurai-euler-env
engine:
  source: ../samurai-euler
  code_file: scenario.hpp
run:
  target: euler_2d
  output_prefix: kelvin_helmholtz_hllc
  output_subdir: results
  profiles:
    ci:
      args: ["--test-case", "kelvin_helmholtz", "--scheme", "hllc", "--Tf", "2.0", "--min-level", "2", "--max-level", "8"]
      nfiles: 60
    hero:
      args: ["--test-case", "kelvin_helmholtz", "--scheme", "hllc", "--Tf", "2.0", "--min-level", "2", "--max-level", "10"]
      nfiles: 150
