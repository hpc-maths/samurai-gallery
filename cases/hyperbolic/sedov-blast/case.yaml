title: Sedov blast wave
summary: A point energy release drives a circular blast wave; the mesh refines on the expanding shock.
authors:
  - The samurai-euler team
methods:
  - finite-volume
equation: compressible-euler
dimension: 2
adaptation: multiresolution
difficulty: advanced
featured: true
tags:
  - compressible
  - blast
  - shock
  - hllc
requires:
  - mpi
references:
  - text: "samurai-euler (Euler solver engine)"
    url: "https://github.com/hpc-maths/samurai-euler"
  - text: "Sedov-Taylor blast wave"
    url: "https://en.wikipedia.org/wiki/Taylor%E2%80%93von_Neumann%E2%80%93Sedov_blast_wave"
media:
  thumbnail: thumbnail.png
  hero: preview.mp4
engine:
  repo: hpc-maths/samurai-euler
  # The commit the displayed scenario.hpp was copied from. A branch would let
  # the engine change under the case (test cases renamed, constants fixed).
  ref: 700f37a98ada02d5aa00331683e44da6fe4d9fd9
  env: samurai-euler-env
  code_file: scenario.hpp
run:
  target: euler_2d
  output_prefix: sedov_blast_hllc
  output_subdir: results
  profiles:
    ci:
      args: ["--test-case", "sedov_blast", "--scheme", "hllc", "--Tf", "0.15", "--min-level", "2", "--max-level", "8"]
      nfiles: 40
    hero:
      args: ["--test-case", "sedov_blast", "--scheme", "hllc", "--Tf", "0.15", "--min-level", "2", "--max-level", "10"]
      nfiles: 100
