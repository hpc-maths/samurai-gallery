title: Double Mach reflection
summary: "A Mach-10 shock strikes a wedge, producing the classic double Mach reflection pattern."
authors:
  - The samurai-euler team
methods:
  - finite-volume
equation: compressible-euler
dimension: 2
adaptation: multiresolution
difficulty: advanced
featured: false
tags:
  - compressible
  - hllc
requires:
  - mpi
references:
  - text: "samurai-euler (Euler solver engine)"
    url: "https://github.com/hpc-maths/samurai-euler"
media:
  thumbnail: thumbnail.png
  hero: preview.mp4
engine:
  repo: hpc-maths/samurai-euler
  # The commit the displayed scenario.hpp was copied from. A branch would let
  # the engine change under the case (test cases renamed, constants fixed).
  ref: 700f37a98ada02d5aa00331683e44da6fe4d9fd9
  env: samurai-euler-env
  code_file: scenario.hpp
run:
  target: euler_2d
  output_prefix: double_mach_reflection_hllc
  output_subdir: results
  profiles:
    ci:
      args: ["--test-case", "double_mach_reflection", "--scheme", "hllc", "--Tf", "0.2", "--min-level", "2", "--max-level", "8"]
      nfiles: 50
    hero:
      args: ["--test-case", "double_mach_reflection", "--scheme", "hllc", "--Tf", "0.2", "--min-level", "2", "--max-level", "10"]
      nfiles: 120
